name: Magniom Continuous Verification & CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage0-pr-policy:
    name: Stage 0 — PR Policy & Automated Change Classification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Evaluate PR Policy & Classify Changes
        run: npm run verify:stage0

  stage1-static-verification:
    name: Stage 1 — Static Verification & Target Engine Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Architectural Package Boundaries
        run: npm run verify:boundaries

      - name: Verify Target Engine Static Rules (Determinism & Purity)
        run: npm run verify:static-rules

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Prettier Format Check
        run: npm run format:check

  stage2-unit-and-traceability:
    name: Stage 2 — Unit Tests & Requirements Traceability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Requirements Traceability (35 SRS Requirements)
        run: npm run verify:requirements

      - name: Run Monorepo Unit Tests (Vitest)
        run: npm test

  stage3-property-invariants:
    name: Stage 3 — Property-Based Invariant Tests (fast-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Property-Based Invariant Tests (fast-check)
        run: npm run verify:properties

  stage4-database-and-rls:
    name: Stage 4 — Zero-State DB Rebuild & 11-Domain RLS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Database Zero-State Rebuild & RLS Matrix
        run: npm run verify:db:from-zero

  stage5-golden-and-scientific-impact:
    name: Stage 5 — Golden Cases (G01–G20) & Scientific Impact Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Golden Cases Suite & Scientific Impact Evaluation (S0–S4)
        run: npm run verify:scientific-impact

  stage6-application-and-worker-integration:
    name: Stage 6 — Application Integration & Synthetic Workflow Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Workflow Worker & Synthetic E2E Verification
        run: npm run verify:stage6

  stage7-presentation-and-safety-views:
    name: Stage 7 — Presentation & UX Visual Safety Assertions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Presentation Model & UX Safety Tests
        run: npm run verify:stage7

  stage8-security-and-supply-chain:
    name: Stage 8 — Security, SBOM, Secrets & Penetration Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate & Verify CycloneDX 1.5 SBOM
        run: npm run sbom:generate && npm run sbom:verify

      - name: Verify Secret Hygiene & Leak Prevention
        run: npm run security:secrets

      - name: Execute Penetration Testing Readiness Probe
        run: npm run security:probe

  stage-neurocompute-scientific-service:
    name: NeuroCompute Service — Python Pipeline & Reliability Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: services/neurocompute
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run NeuroCompute Scientific Test Suites
        working-directory: services/neurocompute
        run: |
          pytest tests/ -v

  stage9-reproducible-build:
    name: Stage 9 — Reproducible Monorepo Build & Verification Manifest
    runs-on: ubuntu-latest
    needs:
      - stage0-pr-policy
      - stage1-static-verification
      - stage2-unit-and-traceability
      - stage3-property-invariants
      - stage4-database-and-rls
      - stage5-golden-and-scientific-impact
      - stage6-application-and-worker-integration
      - stage7-presentation-and-safety-views
      - stage8-security-and-supply-chain
      - stage-neurocompute-scientific-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Monorepo Workspaces
        run: npm run build

      - name: Generate & Seal Master Release Manifest
        run: npm run release:manifest

      - name: Archive Release Qualification Package
        uses: actions/upload-artifact@v4
        with:
          name: magniom-release-qualification-package
          path: |
            docs/verification/verification-build-m3-manifest.json
            docs/verification/traceability-matrix.md
            docs/verification/reports/*.md
            docs/security/sbom/*.json
