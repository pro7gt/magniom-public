name: Stage 9 — Controlled Release Candidate Build & Attestation

on:
  push:
    tags:
      - 'v*.*.*'
      - 'rc-*'
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Release Classification (PATCH, MINOR, MAJOR, CANDIDATE)'
        required: true
        default: 'CANDIDATE'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release-candidate:
    name: Build Once & Generate Cryptographic Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify All Package Boundaries & Rules
        run: npm run verify:boundaries && npm run verify:static-rules

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Execute Full Monorepo Tests & Property Invariants
        run: npm test && npm run verify:properties

      - name: Execute Golden Cases & Scientific Impact Gating
        run: npm run verify:scientific-impact

      - name: Build Monorepo Workspaces (Build Once Principle)
        run: npm run build

      - name: Generate SBOM & Verify Supply Chain
        run: npm run sbom:generate && npm run sbom:verify

      - name: Generate Sealed Clinical Release Manifest
        run: npm run release:manifest

      - name: Verify Formal Verification Exit Criteria
        run: npm run verify:exit-criteria

      - name: Archive Release Qualification Package
        uses: actions/upload-artifact@v4
        with:
          name: magniom-release-qualification-package
          path: |
            docs/verification/verification-build-m3-manifest.json
            docs/verification/traceability-matrix.md
            docs/verification/reports/*.md
            docs/security/sbom/*.json
