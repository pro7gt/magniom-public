name: Magniom Multimodal Measurement Pipeline (ci-measurements)

# Conforms to MAGNIOM-Enterprise Verification, Testing & CI/CD Specification v2.0 (§66–79, §192)
# Goal: Dedicated multimodal measurement provider tests (MRI, lesion, rs-fMRI, task-fMRI, DWI, MEP, audiology, E-field) & laterality invariants

on:
  pull_request:
    paths:
      - 'packages/modalities/**'
      - 'packages/measurement-core/**'
      - 'packages/measurement-testkit/**'
      - 'services/neurocompute/**'
      - 'services/efield/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement-providers-typescript:
    name: Modalities, Measurement Core & Testkit Verification (§66–79)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Multimodal Measurement Spec Conformance
        run: npm run verify:measurement-spec

      - name: Run Modalities & Measurement Test Suites
        run: npx vitest run packages/modalities/ packages/measurement-core/ packages/measurement-testkit/

      - name: Release-Blocking Laterality & Coordinate Conversion Tests (§76–77)
        run: npx vitest run packages/target-engine/tests/v2/laterality-release-blocking.test.ts

  measurement-service-python:
    name: Python NeuroCompute & E-Field Pipeline Tests (§66–75, §107)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install NeuroCompute Python Dependencies
        working-directory: services/neurocompute
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run NeuroCompute Pipeline & Reliability Tests
        working-directory: services/neurocompute
        run: pytest tests/ -v
