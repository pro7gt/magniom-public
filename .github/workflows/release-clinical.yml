name: Magniom Clinical Release Pipeline (release-clinical)

# Conforms to MAGNIOM-Enterprise Verification, Testing & CI/CD Specification v2.0 (§31, §135–138, §195)
# CORE RULE (§10): CI/CD may automate verification and deployment preparation.
# It SHALL NOT autonomously confer Clinical Mode authority.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Release ID to deploy (e.g. MAGNIOM-RELEASE-v2.0.0-20260903)'
        required: true
        default: 'MAGNIOM-RELEASE-v2.0.0-20260903'
      environment:
        description: 'Target Environment'
        required: true
        default: 'clinical-staging'
        type: choice
        options:
          - 'validation'
          - 'clinical-staging'
          - 'production'

permissions:
  contents: read

jobs:
  clinical-release-governance:
    name: Multi-Signature Attestation & Controlled Environment Promotion (§14, §133)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'clinical-staging' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify MagniomReleaseManifestV2 Multi-Party Signatures (§133)
        run: npx tsx scripts/release/generate-release-manifest-v2.ts --verify-only

      - name: Run Multi-Indication Post-Deployment Scientific Smoke Tests (§148–149)
        run: npx tsx scripts/release/post-deploy-golden-smoke.ts

      - name: Confirm Operational Module Kill Switch Status (§183–184)
        run: npx tsx scripts/release/module-kill-switch.ts status
