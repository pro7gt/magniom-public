name: Magniom Scientific Regression Pipeline (ci-scientific)

# Conforms to MAGNIOM-Enterprise Verification, Testing & CI/CD Specification v2.0 (§26, §28, §194)
# Goal: Exhaustive multi-indication scientific determinism & spatial differential evaluation

on:
  pull_request:
    paths:
      - 'packages/target-engine/**'
      - 'packages/evidence/**'
      - 'packages/scientific-policy/**'
      - 'packages/modalities/**'
      - 'packages/measurement-core/**'
      - 'packages/measurement-testkit/**'
      - 'packages/test-fixtures/**'
      - 'scientific-config/**'
      - 'evidence/**'
      - 'packages/networks/**'
      - 'services/neurocompute/**'
  schedule:
    - cron: '0 2 * * *' # Nightly Scientific Pipeline at 02:00 UTC (§28)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-scientific-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scientific-differential-evaluation:
    name: Multi-Indication 72 Golden Cases & Spatial Differentials (§50–65, §119–121)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Release-Blocking Laterality & Coordinate Invariants (§76–77)
        run: npx vitest run packages/target-engine/tests/v2/laterality-release-blocking.test.ts

      - name: Adversarial Tenancy & Wrong-Module Boundaries (§46, §65)
        run: npx vitest run packages/target-engine/tests/v2/adversarial-boundaries.test.ts

      - name: Module Kill Switch Operational Tests (§183–184)
        run: npx vitest run packages/target-engine/tests/v2/module-kill-switch.test.ts

      - name: Multi-Indication 72 Golden Cases & Spatial Differential Engine (§119)
        run: npx tsx scripts/scientific/evaluate-scientific-impact.ts

      - name: Upload Scientific Differential Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-differential-reports
          path: |
            docs/verification/v2/scientific-impact-report.json
            docs/verification/v2/reports/scientific-impact-report.md

  neurocompute-scientific-service:
    name: NeuroCompute Multimodal Processing & Reliability Tests (§66–75)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: services/neurocompute
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Execute NeuroCompute Scientific Test Suite
        working-directory: services/neurocompute
        run: pytest tests/ -v
