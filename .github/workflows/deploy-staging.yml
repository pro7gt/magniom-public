name: Magniom Staging Deployment Pipeline (deploy-staging)

# Conforms to MAGNIOM-Enterprise Verification, Testing & CI/CD Specification v2.0 (§22, §136, §192)
# Goal: Rehearse migrations, verify secrets, deploy release artifacts to clinical-staging & execute post-deployment smoke tests

on:
  workflow_dispatch:
    inputs:
      releaseId:
        description: 'Release ID to deploy (e.g. MAGNIOM-RELEASE-v2.0.0-20260903)'
        required: true
        default: 'MAGNIOM-RELEASE-v2.0.0-20260903'

permissions:
  contents: read

jobs:
  deploy-to-clinical-staging:
    name: Deploy to Clinical Staging & Rehearse Migrations (§22, §136)
    runs-on: ubuntu-latest
    environment: clinical-staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify MagniomReleaseManifestV2 Integrity (§131)
        run: npx tsx scripts/release/generate-release-manifest-v2.ts --verify-only

      - name: Rehearse Database Zero-State Rebuild & Migrations (§139)
        run: npm run verify:db:from-zero

      - name: Verify Secret Hygiene & Deployment Tokens (§156)
        run: npm run security:secrets

      - name: Deploy Staging Application & Worker Services
        run: echo "🚀 Deploying immutable release bundle to clinical-staging environment..."

      - name: Execute Post-Deployment Multi-Indication Scientific Smoke Tests (§148–149)
        run: npx tsx scripts/release/post-deploy-golden-smoke.ts

      - name: Confirm Operational Module Kill Switch Status (§183–184)
        run: npx tsx scripts/release/module-kill-switch.ts status
