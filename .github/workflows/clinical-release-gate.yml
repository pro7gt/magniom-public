name: Stage 10 — Clinical Release Gate & Runtime Verification

on:
  workflow_dispatch:
    inputs:
      targetEnvironment:
        description: 'Deployment Environment (CLINICAL_STAGING or CLINICAL_PRODUCTION)'
        required: true
        default: 'CLINICAL_STAGING'
      manifestSha256:
        description: 'Approved Clinical Release Manifest SHA-256 Digest'
        required: true
      leadClinicianApproval:
        description: 'Lead Clinical Specialist Approver ID'
        required: true
      scientificOfficerApproval:
        description: 'Chief Scientific Officer Approver ID'
        required: true
      qualityOfficerApproval:
        description: 'Regulatory & Quality Officer Approver ID'
        required: true

jobs:
  release-gate-validation:
    name: Release Gate Approval & Digest Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Multi-Stakeholder Release Approval Matrix (No Self-Approval)
        run: |
          echo "Verifying independent multi-stakeholder release approvals (Section 14 & 443)..."
          test -n "${{ github.event.inputs.leadClinicianApproval }}"
          test -n "${{ github.event.inputs.scientificOfficerApproval }}"
          test -n "${{ github.event.inputs.qualityOfficerApproval }}"

          # Enforce distinct approver identities (No Self-Approval)
          if [ "${{ github.event.inputs.leadClinicianApproval }}" = "${{ github.event.inputs.scientificOfficerApproval }}" ] || \
             [ "${{ github.event.inputs.scientificOfficerApproval }}" = "${{ github.event.inputs.qualityOfficerApproval }}" ] || \
             [ "${{ github.event.inputs.leadClinicianApproval }}" = "${{ github.event.inputs.qualityOfficerApproval }}" ]; then
            echo "❌ Policy Violation: Clinical Release approvers must be distinct independent officers."
            exit 1
          fi
          echo "✅ Multi-stakeholder independent approvals verified."

      - name: Verify Manifest Digest Consistency
        run: |
          npx tsx scripts/release/generate-release-manifest-v2.ts --verify-only

      - name: Generate Case Recall & Affected Cases Index
        run: |
          npm run release:affected-cases

      - name: Execute Post-Deployment Golden Smoke Test
        run: |
          npm run postdeploy:smoke
