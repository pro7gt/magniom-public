name: Magniom Security & Supply Chain Pipeline (ci-security)

# Conforms to MAGNIOM-Enterprise Verification, Testing & CI/CD Specification v2.0 (§99–106, §156–161, §192)
# Goal: Comprehensive dependency auditing, CycloneDX 1.5 SBOM verification, secret hygiene, pentest probe & DR backup drill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly security audit on Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-supply-chain-audit:
    name: Security, SBOM, Secrets & Penetration Readiness (§99–106)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit (§99)
        run: npm audit --audit-level=high || true

      - name: Generate & Verify CycloneDX 1.5 SBOM (§103)
        run: npm run sbom:generate && npm run sbom:verify

      - name: Secret Hygiene & Entropy Leak Prevention (§156–157)
        run: npm run security:secrets

      - name: Penetration Testing Readiness Probe (§101)
        run: npm run security:probe

      - name: Backup & Disaster Recovery Verification Drill (§97–98)
        run: npm run security:backup-drill

      - name: Archive Security & SBOM Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-evidence
          path: |
            docs/security/sbom/cyclonedx-sbom-1.5.json
            docs/security/secret-hygiene-report.json
            docs/security/pentest-probe-report.json
