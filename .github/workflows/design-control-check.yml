name: Design Control & Risk Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  design-controls:
    name: ISO 14971 Risk & IEC 62304 Design Control Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Requirements & Risk Traceability Verification
        run: npm run verify:requirements

      - name: Validate Verification Exit Criteria
        run: npm run verify:exit-criteria
