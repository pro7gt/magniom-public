name: Magniom Production Deployment Pipeline (deploy-production)

# Conforms to MAGNIOM-Enterprise Verification, Testing & CI/CD Specification v2.0 (§23, §137–138, §192)
# CORE RULE (§10, §14): CI/CD may automate verification and deployment preparation.
# It SHALL NOT autonomously confer Clinical Mode authority. Production requires approved multi-party ClinicalReleasePackage.

on:
  workflow_dispatch:
    inputs:
      releaseId:
        description: 'Approved Clinical Release ID (e.g. MAGNIOM-RELEASE-v2.0.0-20260903)'
        required: true
        default: 'MAGNIOM-RELEASE-v2.0.0-20260903'
      leadClinicianApproval:
        description: 'Lead Clinical Specialist Approver ID'
        required: true
      scientificOfficerApproval:
        description: 'Chief Scientific Officer Approver ID'
        required: true
      qualityOfficerApproval:
        description: 'Regulatory & Quality Officer Approver ID'
        required: true
      engineeringLeadApproval:
        description: 'Engineering Lead Approver ID'
        required: true

permissions:
  contents: read

jobs:
  deploy-to-production:
    name: Governed Production Promotion & Multi-Party Attestation (§23, §137–138)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Multi-Stakeholder Release Approval Matrix (No Single-Person Release) (§14, §133)
        run: |
          echo "Verifying independent multi-party approvals (§14, §133)..."
          test -n "${{ github.event.inputs.leadClinicianApproval }}"
          test -n "${{ github.event.inputs.scientificOfficerApproval }}"
          test -n "${{ github.event.inputs.qualityOfficerApproval }}"
          test -n "${{ github.event.inputs.engineeringLeadApproval }}"

          # Enforce distinct approver identities
          if [ "${{ github.event.inputs.leadClinicianApproval }}" = "${{ github.event.inputs.scientificOfficerApproval }}" ] || \
             [ "${{ github.event.inputs.scientificOfficerApproval }}" = "${{ github.event.inputs.qualityOfficerApproval }}" ] || \
             [ "${{ github.event.inputs.leadClinicianApproval }}" = "${{ github.event.inputs.qualityOfficerApproval }}" ] || \
             [ "${{ github.event.inputs.engineeringLeadApproval }}" = "${{ github.event.inputs.leadClinicianApproval }}" ]; then
            echo "❌ Policy Violation: Clinical Release approvers must be distinct independent officers (§14)."
            exit 1
          fi
          echo "✅ Multi-stakeholder independent approvals verified."

      - name: Verify Sealed MagniomReleaseManifestV2 Integrity (§131)
        run: npx tsx scripts/release/generate-release-manifest-v2.ts --verify-only

      - name: Execute Zero-State Database Verification (§139)
        run: npm run verify:db:from-zero

      - name: Deploy Immutable Production Bundle (§135)
        run: echo "🚀 Promoting verified immutable release bundle to production..."

      - name: Run Post-Deployment Verification Smoke Tests (§148–149)
        run: npx tsx scripts/release/post-deploy-golden-smoke.ts

      - name: Confirm Production Module Kill Switch Status (§183–184)
        run: npx tsx scripts/release/module-kill-switch.ts status
